name: dataplus_app
description: "DATA PLUS All-in-One Portal & Native Downloader"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  open_filex: ^4.5.0
  video_player: ^2.9.2
  chewie: ^1.8.5
  package_info_plus: ^10.2.2 # Explicitly add the working version

# 🌟 FORCE RESOLUTION FOR FLUTTER_TEST CONFLICTS
dependency_overrides:
  meta: 1.15.0 # Lock to the version flutter_test 3.24.0 requires
  path: 1.9.0  # Lock to the version flutter_test 3.24.0 requires

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
