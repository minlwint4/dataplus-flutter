name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Scaffold Android & Inject Storage Bridge
      run: |
        if [ ! -d "android" ]; then
          echo "Generating Android Project structure..."
          flutter create . --org com.example --project-name dataplus_app
          
          if [ -f "android/settings.gradle" ]; then
            sed -i -E 's/id "org\.jetbrains\.kotlin\.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i -E 's/ext\.kotlin_version = .*/ext.kotlin_version = "1.9.24"/' android/build.gradle
          fi

          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"/g' android/app/src/main/AndroidManifest.xml

          mkdir -p android/app/src/main/kotlin/com/example/dataplus_app
          echo 'package com.example.dataplus_app' > android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo 'import android.os.Environment' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo 'import android.os.StatFs' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo 'import io.flutter.embedding.android.FlutterActivity' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo 'import io.flutter.embedding.engine.FlutterEngine' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo 'import io.flutter.plugin.common.MethodChannel' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo 'class MainActivity: FlutterActivity() {' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '    private val CHANNEL = "com.dataplus/storage"' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '        super.configureFlutterEngine(flutterEngine)' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '            if (call.method == "getStorageSpace") {' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                try {' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                    val path = Environment.getExternalStorageDirectory()' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                    val stat = StatFs(path.path)' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                    val blockSize = stat.blockSizeLong' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                    val totalBlocks = stat.blockCountLong' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                    val availableBlocks = stat.availableBlocksLong' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                    val map = HashMap<String, Long>()' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                    map["total"] = totalBlocks * blockSize' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                    map["free"] = availableBlocks * blockSize' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                    result.success(map)' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                } catch (e: Exception) {' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                    result.error("ERROR", e.message, null)' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                }' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '            } else {' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '                result.notImplemented()' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '            }' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '        }' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '    }' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
          echo '}' >> android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt
        fi

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK (Release)
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DATAPLUS_AllInOne_v1.0
        path: build/app/outputs/flutter-apk/app-release.apk
