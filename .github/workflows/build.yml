name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configure Maven Central Mirror
      run: |
        mkdir -p ~/.gradle/init.d
        cat << 'EOF' > ~/.gradle/init.d/mirror.init.gradle
        def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2/"
        allprojects {
            buildscript {
                repositories {
                    all { ArtifactRepository repo ->
                        if (repo instanceof MavenArtifactRepository) {
                            def url = repo.url.toString()
                            if (url.contains("repo.maven.apache.org") || url.contains("repo1.maven.org")) {
                                repo.setUrl(mirrorUrl)
                            }
                        }
                    }
                }
            }
            repositories {
                all { ArtifactRepository repo ->
                    if (repo instanceof MavenArtifactRepository) {
                        def url = repo.url.toString()
                        if (url.contains("repo.maven.apache.org") || url.contains("repo1.maven.org")) {
                            repo.setUrl(mirrorUrl)
                        }
                    }
                }
            }
        }
        EOF

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Configure Android Project & Force Kotlin 1.9.24
      run: |
        echo "Generating fresh Android Project structure..."
        rm -rf android
        flutter create . --org com.example --project-name dataplus_app

        mkdir -p android
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
        echo "flutter.buildMode=release" >> android/local.properties
        echo "flutter.versionName=1.0.0" >> android/local.properties
        echo "flutter.versionCode=1" >> android/local.properties

        python3 -c "
        import os, re

        kotlin_version = '1.9.24'

        # 1. 🌟 Correctly target ONLY org.jetbrains.kotlin.android in settings.gradle
        sg = 'android/settings.gradle'
        if os.path.exists(sg):
            with open(sg, 'r', encoding='utf-8') as f:
                c = f.read()
            c = re.sub(r'(id\s*[\'\"\(]org\.jetbrains\.kotlin\.android[\'\"\)]\s+version\s+[\'\"])[^\'\"]+([\'\"])', r'\g<1>1.9.24\g<2>', c)
            with open(sg, 'w', encoding='utf-8') as f:
                f.write(c)

        # 2. Update build.gradle
        bg = 'android/build.gradle'
        if os.path.exists(bg):
            with open(bg, 'r', encoding='utf-8') as f:
                c = f.read()
            c = re.sub(r'ext\.kotlin_version\s*=\s*[\'\"][^\'\"]*[\'\"]', f\"ext.kotlin_version = '{kotlin_version}'\", c)
            c = re.sub(r'org\.jetbrains\.kotlin:kotlin-gradle-plugin:[\d\.]+', f'org.jetbrains.kotlin:kotlin-gradle-plugin:{kotlin_version}', c)
            
            if 'ext.kotlin_version' not in c:
                if 'buildscript {' in c:
                    c = c.replace('buildscript {', f\"buildscript {{\n    ext.kotlin_version = '{kotlin_version}'\")
                else:
                    c = f\"buildscript {{\n    ext.kotlin_version = '{kotlin_version}'\n}}\n\" + c
            
            if 'resolutionStrategy.eachDependency' not in c:
                c += f\"\nallprojects {{\n    configurations.all {{\n        resolutionStrategy.eachDependency {{ details ->\n            if (details.requested.group == 'org.jetbrains.kotlin') {{\n                details.useVersion '{kotlin_version}'\n            }}\n        }}\n    }}\n}}\n\"
            
            with open(bg, 'w', encoding='utf-8') as f:
                f.write(c)
        print('Kotlin version successfully forced to 1.9.24 without breaking Android plugin')
        "

        mkdir -p android/app/src/main/res/xml
        printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<paths xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <external-path name="external_files" path="." />' \
          '    <external-storage-path name="external_storage" path="." />' \
          '    <root-path name="root" path="." />' \
          '</paths>' > android/app/src/main/res/xml/filepaths.xml

        sed -i 's/android:label="[^"]*"/android:label="DATA_PLUS"/g' android/app/src/main/AndroidManifest.xml
        sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml
        sed -i 's/<application/<application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"/g' android/app/src/main/AndroidManifest.xml

        sed -i '/<\/application>/i \        <provider\n            android:name="androidx.core.content.FileProvider"\n            android:authorities="${applicationId}.fileProvider"\n            android:exported="false"\n            android:grantUriPermissions="true">\n            <meta-data\n                android:name="android.support.FILE_PROVIDER_PATHS"\n                android:resource="@xml/filepaths" \/>\n        <\/provider>' android/app/src/main/AndroidManifest.xml

        mkdir -p android/app/src/main/kotlin/com/example/dataplus_app
        printf '%s\n' \
          'package com.example.dataplus_app' \
          '' \
          'import android.content.Intent' \
          'import android.net.Uri' \
          'import android.os.Build' \
          'import android.os.Environment' \
          'import android.os.StatFs' \
          'import androidx.core.content.FileProvider' \
          'import java.io.File' \
          'import io.flutter.embedding.android.FlutterActivity' \
          'import io.flutter.embedding.engine.FlutterEngine' \
          'import io.flutter.plugin.common.MethodChannel' \
          '' \
          'class MainActivity: FlutterActivity() {' \
          '    private val CHANNEL = "com.dataplus/storage"' \
          '    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {' \
          '        super.configureFlutterEngine(
