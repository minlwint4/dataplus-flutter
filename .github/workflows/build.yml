name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Configure Android Project & Inject FileProvider
      run: |
        if [ ! -d "android" ]; then
          echo "Generating Android Project structure..."
          flutter create . --org com.example --project-name dataplus_app
        fi

        if [ -f "android/settings.gradle" ]; then
          sed -i -E 's/id "org\.jetbrains\.kotlin\.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
        fi

        printf '%s\n' \
          'buildscript {' \
          '    ext.kotlin_version = "1.9.24"' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '    dependencies {' \
          '        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"' \
          '    }' \
          '}' \
          'allprojects {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '    configurations.all {' \
          '        resolutionStrategy.eachDependency { details ->' \
          '            if (details.requested.group == "org.jetbrains.kotlin") {' \
          '                details.useVersion "1.9.24"' \
          '            }' \
          '        }' \
          '    }' \
          '}' > android/build.gradle.prefix

        cat android/build.gradle.prefix android/build.gradle > android/build.gradle.tmp
        mv android/build.gradle.tmp android/build.gradle
        rm -f android/build.gradle.prefix

        # 1. filepaths.xml ဖန်တီးခြင်း
        mkdir -p android/app/src/main/res/xml
        printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<paths xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <external-path name="external_files" path="." />' \
          '    <external-storage-path name="external_storage" path="." />' \
          '    <root-path name="root" path="." />' \
          '</paths>' > android/app/src/main/res/xml/filepaths.xml

        # 2. Permissions ထည့်သွင်းခြင်း
        sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml
        sed -i 's/<application/<application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"/g' android/app/src/main/AndroidManifest.xml

        # 3. FileProvider ထည့်သွင်းခြင်း
        sed -i '/<\/application>/i \        <provider\n            android:name="androidx.core.content.FileProvider"\n            android:authorities="${applicationId}.fileProvider"\n            android:exported="false"\n            android:grantUriPermissions="true">\n            <meta-data\n                android:name="android.support.FILE_PROVIDER_PATHS"\n                android:resource="@xml/filepaths" \/>\n        <\/provider>' android/app/src/main/AndroidManifest.xml

        # 4. Storage တိုင်းပေးမည့် Kotlin Native Bridge ထည့်သွင်းခြင်း
        mkdir -p android/app/src/main/kotlin/com/example/dataplus_app
        printf '%s\n' \
          'package com.example.dataplus_app' \
          '' \
          'import android.os.Environment' \
          'import android.os.StatFs' \
          'import io.flutter.embedding.android.FlutterActivity' \
          'import io.flutter.embedding.engine.FlutterEngine' \
          'import io.flutter.plugin.common.MethodChannel' \
          '' \
          'class MainActivity: FlutterActivity() {' \
          '    private val CHANNEL = "com.dataplus/storage"' \
          '    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {' \
          '        super.configureFlutterEngine(flutterEngine)' \
          '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->' \
          '            if (call.method == "getStorageSpace") {' \
          '                try {' \
          '                    val path = Environment.getExternalStorageDirectory()' \
          '                    val stat = StatFs(path.path)' \
          '                    val blockSize = stat.blockSizeLong' \
          '                    val totalBlocks = stat.blockCountLong' \
          '                    val availableBlocks = stat.availableBlocksLong' \
          '                    val map = HashMap<String, Long>()' \
          '                    map["total"] = totalBlocks * blockSize' \
          '                    map["free"] = availableBlocks * blockSize' \
          '                    result.success(map)' \
          '                } catch (e: Exception) {' \
          '                    result.error("ERROR", e.message, null)' \
          '                }' \
          '            } else {' \
          '                result.notImplemented()' \
          '            }' \
          '        }' \
          '    }' \
          '}' > android/app/src/main/kotlin/com/example/dataplus_app/MainActivity.kt

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK (Release)
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DATAPLUS_AllInOne_v1.0
        path: build/app/outputs/flutter-apk/app-release.apk
