name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Scaffold Android Project Structure
      run: |
        if [ ! -d "android" ]; then
          echo "Generating Android Project structure..."
          flutter create . --org com.example --project-name dataplus_app
          
          # ⚡ Kotlin ဗားရှင်းကို 1.9.24 သို့ အလိုအလျောက် မြှင့်တင်ပေးမည့် အဆင့်
          if [ -f "android/settings.gradle" ]; then
            sed -i -E 's/id "org\.jetbrains\.kotlin\.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i -E 's/ext\.kotlin_version = .*/ext.kotlin_version = "1.9.24"/' android/build.gradle
          fi

          # ⚡ Storage Permissions & Local Network (10.10.10.10) ခွင့်ပြုချက်များ ထည့်သွင်းခြင်း
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"/g' android/app/src/main/AndroidManifest.xml
        fi

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK (Release)
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DATAPLUS_AllInOne_v1.0
        path: build/app/outputs/flutter-apk/app-release.apk
